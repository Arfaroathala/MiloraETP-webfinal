<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Costing & R&D — Milora Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --cream:#FAF6EE;--gold:#C9A84C;--gold-dark:#A07830;--wood:#7B4F2E;
  --wood-light:#A0714F;--brown-text:#3E2A14;--warm-white:#FFFCF5;
  --border:#D4B483;--shadow:rgba(123,79,46,0.15);
  --font-display:'Playfair Display',serif;--font-body:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--cream);color:var(--brown-text);min-height:100vh;}
#loginScreen,#deniedScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--warm-white);border:1px solid var(--border);border-radius:24px;padding:36px 28px;max-width:400px;width:100%;box-shadow:0 20px 60px var(--shadow);text-align:center;}
.card h1{font-family:var(--font-display);font-size:21px;margin-bottom:4px;}
.card p{font-size:13px;color:var(--wood-light);margin-bottom:24px;}
.inp{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;font-family:var(--font-body);font-size:14px;color:var(--brown-text);background:white;outline:none;margin-bottom:12px;}
.inp:focus{border-color:var(--gold);}
.btn-main{width:100%;background:linear-gradient(135deg,var(--wood),var(--gold-dark));color:white;border:none;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;}
.btn-main:disabled{opacity:.5;}
.err-box{font-size:12px;color:#C62828;margin-top:12px;display:none;background:#FFEBEE;border:1px solid #FFCDD2;border-radius:8px;padding:8px 12px;}
.err-box.show{display:block;}
#dashboard{display:none;}
.dash-header{background:linear-gradient(135deg,var(--wood),var(--gold-dark));padding:20px 24px;display:flex;align-items:center;justify-content:space-between;}
.dash-header h1{font-family:var(--font-display);color:white;font-size:19px;}
.dash-header p{color:rgba(255,255,255,.8);font-size:11px;}
.btn-logout{background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.3);padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;}
.container{max-width:820px;margin:0 auto;padding:24px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-head h2{font-family:var(--font-display);font-size:19px;}
.btn-add{background:var(--gold-dark);color:white;border:none;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;}
.mat-card{background:var(--warm-white);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:10px;}
.mat-top{display:flex;justify-content:space-between;align-items:center;}
.mat-name{font-weight:700;font-size:15px;}
.mat-inactive{opacity:.5;}
.mat-price{color:var(--gold-dark);font-weight:700;font-size:14px;}
.mat-sub{font-size:11.5px;color:var(--wood-light);margin-top:3px;}
.badge-inactive{background:#EEE;color:#888;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:8px;}
.modal-overlay{position:fixed;inset:0;background:rgba(62,42,20,.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--cream);border-radius:24px 24px 0 0;padding:26px 22px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-box h3{font-family:var(--font-display);font-size:18px;margin-bottom:16px;}
label{font-size:12px;font-weight:600;color:var(--wood);display:block;margin-bottom:5px;margin-top:12px;}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hist-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
.hist-row:last-child{border-bottom:none;}
.hist-current{color:var(--gold-dark);font-weight:700;}
select.inp{cursor:pointer;}
.btn-row{display:flex;gap:10px;margin-top:20px;}
.btn-cancel{flex:1;background:white;border:1.5px solid var(--border);color:var(--wood);padding:13px;border-radius:12px;font-weight:600;cursor:pointer;}
.btn-save{flex:2;background:var(--gold-dark);color:white;border:none;padding:13px;border-radius:12px;font-weight:600;cursor:pointer;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--brown-text);color:white;padding:13px 22px;border-radius:14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:9999;opacity:0;transition:.3s;max-width:90vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.empty{text-align:center;padding:40px 20px;color:var(--wood-light);font-size:13px;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="card">
    <h1>Costing & R&D</h1>
    <p>Khusus Owner — Milora Enterprise</p>
    <input type="email" class="inp" id="loginEmail" placeholder="Email"/>
    <input type="password" class="inp" id="loginPass" placeholder="Password"/>
    <button class="btn-main" id="loginBtn" onclick="doLogin()">Masuk</button>
    <div class="err-box" id="loginErr"></div>
  </div>
</div>

<div id="deniedScreen" style="display:none;">
  <div class="card">
    <h1>Akses Ditolak</h1>
    <p>Halaman ini khusus Owner. Akun kamu tidak punya akses ke fitur Costing & R&D.</p>
    <button class="btn-main" onclick="doLogout()">Keluar</button>
  </div>
</div>

<div id="dashboard">
  <div class="dash-header">
    <div><h1>Costing & R&D</h1><p id="ownerLabel">Milora Enterprise</p></div>
    <button class="btn-logout" onclick="doLogout()">Keluar</button>
  </div>
  <div class="container">
    <div class="section-head">
      <h2>Kelola Bahan</h2>
      <button class="btn-add" onclick="openAddMaterial()">+ Tambah Bahan</button>
    </div>
    <div id="materialList"></div>
  </div>
</div>

<div class="modal-overlay" id="modalAddMaterial">
  <div class="modal-box">
    <h3>Tambah Bahan Baru</h3>
    <label>Nama Bahan</label>
    <input type="text" class="inp" id="newMatName" placeholder="Contoh: Winchez"/>
    <label>Satuan Dasar</label>
    <select class="inp" id="newMatUnit">
      <option value="g">gram (g)</option>
      <option value="ml">mililiter (ml)</option>
      <option value="pcs">pcs</option>
    </select>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal('modalAddMaterial')">Batal</button>
      <button class="btn-save" onclick="saveMaterial()">Simpan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalMaterialDetail">
  <div class="modal-box">
    <h3 id="detailMatName">Nama Bahan</h3>
    <div id="detailCurrentPrice" style="margin-bottom:16px;"></div>
    <div style="border-top:1px solid var(--border);padding-top:14px;margin-bottom:14px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:8px;">Riwayat Harga</div>
      <div id="priceHistoryList"></div>
    </div>
    <div style="border-top:1px solid var(--border);padding-top:14px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:4px;">Tambah Harga Baru</div>
      <div class="row-2">
        <div><label>Harga Beli (Rp)</label><input type="number" class="inp" id="newPriceAmount" placeholder="64000"/></div>
        <div><label>Jumlah</label><input type="number" class="inp" id="newPriceQty" placeholder="1"/></div>
      </div>
      <label>Satuan Pembelian</label>
      <select class="inp" id="newPriceUnit"></select>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal('modalMaterialDetail')">Tutup</button>
        <button class="btn-save" onclick="savePrice()">Simpan Harga</button>
      </div>
    </div>
    <div style="border-top:1px solid var(--border);margin-top:16px;padding-top:14px;">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="detailActiveToggle" onchange="toggleMaterialActive()"/>
        <span style="font-size:13px;font-weight:600;">Bahan aktif (dipakai untuk resep baru)</span>
      </label>
    </div>
  </div>
</div>

<script>
var SUPABASE_URL = 'https://sixwcjbhqydufapxftip.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpeHdjamJocXlkdWZhcHhmdGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NDQ5MDMsImV4cCI6MjA5OTAyMDkwM30.zBNVRIKoypww2mDLeVJXZPbfheNPJ2VFV_Rs44jfChQ';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var currentOwnerName = null;

function doLogin(){
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  var errEl = document.getElementById('loginErr');
  var btn = document.getElementById('loginBtn');
  errEl.classList.remove('show');
  if(!email || !pass){ errEl.textContent='Isi email dan password dulu.'; errEl.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = 'Memeriksa...';
  sb.auth.signInWithPassword({ email:email, password:pass }).then(function(res){
    btn.disabled = false; btn.textContent = 'Masuk';
    if(res.error){ errEl.textContent = 'Email atau password salah.'; errEl.classList.add('show'); return; }
    checkAccessAndShow();
  });
}

function doLogout(){
  sb.auth.signOut().then(function(){
    document.getElementById('dashboard').style.display='none';
    document.getElementById('deniedScreen').style.display='none';
    document.getElementById('loginScreen').style.display='flex';
  });
}

// PENTING: ini cuma nentuin TAMPILAN. Penegakan sesungguhnya ada di RLS
// (is_owner()) pada tabel cost_items dkk dari Step 1 — staff yang nyasar
// ke sini pun query-nya akan ditolak database, bukan cuma disembunyikan UI.
function checkAccessAndShow(){
  sb.auth.getUser().then(function(res){
    var uid = res.data && res.data.user ? res.data.user.id : null;
    if(!uid){ doLogout(); return; }
    sb.from('staff').select('name,role').eq('auth_user_id', uid).eq('role','owner').eq('active', true).maybeSingle().then(function(r){
      if(!r.data){
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('deniedScreen').style.display='flex';
        return;
      }
      currentOwnerName = r.data.name;
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('dashboard').style.display='block';
      document.getElementById('ownerLabel').textContent = 'Owner: ' + currentOwnerName;
      loadMaterials();
    });
  });
}

sb.auth.getSession().then(function(res){ if(res.data && res.data.session) checkAccessAndShow(); });

var materials = [];
var priceHistories = {};
var activeDetailId = null;

// Konversi metrik terbatas, hardcode & immutable — bukan tabel yang bisa diedit.
var UNIT_OPTIONS = {
  g:  [{v:'g', label:'gram (g)', factor:1}, {v:'kg', label:'kilogram (kg)', factor:1000}],
  ml: [{v:'ml', label:'mililiter (ml)', factor:1}, {v:'liter', label:'liter (L)', factor:1000}],
  pcs:[{v:'pcs', label:'pcs', factor:1}]
};

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 3000);
}
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function loadMaterials(){
  sb.from('cost_items').select('*').eq('item_type','purchased').order('name').then(function(res){
    if(res.error){ showToast('Gagal memuat bahan: ' + res.error.message); return; }
    materials = res.data || [];
    loadAllPriceHistory();
  });
}

function loadAllPriceHistory(){
  sb.from('cost_item_price_history').select('*').order('effective_from', {ascending:false}).then(function(res){
    priceHistories = {};
    (res.data || []).forEach(function(row){
      if(!priceHistories[row.cost_item_id]) priceHistories[row.cost_item_id] = [];
      priceHistories[row.cost_item_id].push(row);
    });
    renderMaterialList();
  });
}

function currentPriceOf(costItemId){
  var hist = priceHistories[costItemId] || [];
  var now = new Date();
  var eligible = hist.filter(function(h){ return new Date(h.effective_from) <= now; });
  return eligible.length ? eligible[0] : null; // sudah urut terbaru duluan dari query
}

function renderMaterialList(){
  var el = document.getElementById('materialList');
  if(materials.length === 0){
    el.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--wood-light);font-size:13px;">Belum ada bahan. Klik "+ Tambah Bahan" buat mulai.</div>';
    return;
  }
  var h = '';
  materials.forEach(function(m){
    var cur = currentPriceOf(m.id);
    var priceText = cur ? ('Rp' + Number(cur.unit_cost).toLocaleString('id-ID',{maximumFractionDigits:2}) + '/' + m.unit) : 'Belum ada harga';
    h += '<div class="mat-card" onclick="openMaterialDetail(' + m.id + ')"' + (m.active ? '' : ' style="opacity:.5;"') + '>';
    h += '<div style="display:flex;justify-content:space-between;"><span style="font-weight:700;">' + m.name + (m.active ? '' : ' <span style="font-size:10px;color:#888;">(Nonaktif)</span>') + '</span><span style="color:var(--gold-dark);font-weight:700;">' + priceText + '</span></div>';
    h += '<div style="font-size:11.5px;color:var(--wood-light);margin-top:3px;">Satuan dasar: ' + m.unit + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function openMaterialDetail(id){
  activeDetailId = id;
  var m = materials.find(function(x){ return x.id === id; });
  if(!m) return;

  document.getElementById('detailMatName').textContent = m.name;
  document.getElementById('detailActiveToggle').checked = m.active;

  var cur = currentPriceOf(id);
  document.getElementById('detailCurrentPrice').innerHTML = cur
    ? '<div style="background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.35);border-radius:10px;padding:10px 14px;font-size:13px;">Harga aktif: <b>Rp' + Number(cur.unit_cost).toLocaleString('id-ID',{maximumFractionDigits:2}) + '/' + m.unit + '</b></div>'
    : '<div style="color:var(--wood-light);font-size:13px;">Belum ada harga tercatat.</div>';

  var opts = UNIT_OPTIONS[m.unit] || [{v:m.unit, label:m.unit, factor:1}];
  document.getElementById('newPriceUnit').innerHTML = opts.map(function(o){ return '<option value="' + o.v + '">' + o.label + '</option>'; }).join('');
  document.getElementById('newPriceAmount').value = '';
  document.getElementById('newPriceQty').value = '';

  var hist = priceHistories[id] || [];
  var histEl = document.getElementById('priceHistoryList');
  if(hist.length === 0){
    histEl.innerHTML = '<div style="text-align:center;padding:16px 0;color:var(--wood-light);font-size:12.5px;">Belum ada riwayat harga.</div>';
  } else {
    histEl.innerHTML = hist.map(function(h, idx){
      var dt = new Date(h.effective_from).toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'});
      var basis = h.purchase_price ? ('Rp' + Number(h.purchase_price).toLocaleString('id-ID') + '/' + h.purchase_quantity + ' ' + h.purchase_unit) : '-';
      return '<div class="hist-row' + (idx===0?' hist-current':'') + '"><span>' + dt + (idx===0?' (aktif)':'') + '</span><span>' + basis + ' &rarr; Rp' + Number(h.unit_cost).toLocaleString('id-ID',{maximumFractionDigits:2}) + '/' + m.unit + '</span></div>';
    }).join('');
  }

  openModal('modalMaterialDetail');
}

function openAddMaterial(){
  document.getElementById('newMatName').value = '';
  document.getElementById('newMatUnit').value = 'g';
  openModal('modalAddMaterial');
}

function saveMaterial(){
  var name = document.getElementById('newMatName').value.trim();
  var unit = document.getElementById('newMatUnit').value;
  if(!name){ showToast('Nama bahan wajib diisi'); return; }
  var dupe = materials.find(function(m){ return m.name.toLowerCase() === name.toLowerCase(); });
  if(dupe){ showToast('Bahan dengan nama ini sudah ada'); return; }
  var sku = name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  sb.from('cost_items').insert([{ sku: sku, name: name, unit: unit, item_type: 'purchased', active: true }]).then(function(res){
    if(res.error){ showToast('Gagal simpan: ' + res.error.message); return; }
    showToast('Bahan "' + name + '" ditambahkan');
    closeModal('modalAddMaterial');
    loadMaterials();
  });
}
</script>
</body>
</html>
